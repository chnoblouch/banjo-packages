name: Build Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'The package to build'
        required: true
        type: choice
        options:
          - glfw
          - sdl
          - vulkan
          - joltc
          - curl

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM
        run: choco install llvm

      - name: Install Ninja
        run: choco install ninja

      - name: Install NASM
        run: choco install nasm

      - name: Download Banjo toolchain
        run: Invoke-WebRequest -OutFile banjo-x86_64-windows.zip https://github.com/chnoblouch/banjo-lang/releases/latest/download/banjo-x86_64-windows.zip

      - name: Extract Banjo toolchain
        run: Expand-Archive .\banjo-x86_64-windows.zip $ENV:USERPROFILE

      - name: Add Banjo toolchain to PATH
        run: echo "$ENV:USERPROFILE\banjo-x86_64-windows\bin" | Out-File -FilePath $ENV:GITHUB_PATH -Encoding utf8 -Append

      - name: Build package
        run: python build_${{ inputs.package }}.py
        working-directory: .\scripts

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.package }}-x86_64-windows-msvc"
          path: .\packages\${{ inputs.package }}

  build-linux:
    strategy:
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Update package lists
        run: sudo apt-get update

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      - name: Install build dependencies
        run: sudo apt-get install -y xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules

      - name: Download Banjo toolchain
        run: curl -OL https://github.com/chnoblouch/banjo-lang/releases/latest/download/banjo-${{ matrix.arch }}-linux.zip

      - name: Extract Banjo toolchain
        run: unzip banjo-${{ matrix.arch }}-linux.zip -d $HOME
      
      - name: Add Banjo toolchain to PATH
        run: echo "$HOME/banjo-${{ matrix.arch }}-linux/bin" >> $GITHUB_PATH

      - name: Build package
        run: python build_${{ inputs.package }}.py
        working-directory: ./scripts

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.package }}-${{ matrix.arch }}-linux-gnu"
          path: ./packages/${{ inputs.package }}

  build-macos:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: 3.13

      - name: Install Ninja
        run: brew install ninja

      - name: Download Banjo toolchain
        run: curl -OL https://github.com/chnoblouch/banjo-lang/releases/latest/download/banjo-aarch64-macos.zip

      - name: Extract Banjo toolchain
        run: unzip banjo-aarch64-macos.zip -d $HOME
      
      - name: Add Banjo toolchain to PATH
        run: echo "$HOME/banjo-aarch64-macos/bin" >> $GITHUB_PATH

      - name: Build package
        run: python build_${{ inputs.package }}.py
        working-directory: ./scripts

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.package }}-aarch64-macos"
          path: ./packages/${{ inputs.package }}

  upload:
    runs-on: ubuntu-24.04-arm

    needs:
      - build-windows
      - build-linux
      - build-macos

    steps:
      - uses: actions/checkout@v7

      - name: Install s3cmd
        run: sudo apt-get update && sudo apt-get install s3cmd -y

      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          path: ./packages
      
      - name: Merge packages
        run: python ./merge_target_variants.py ${{ inputs.package }}

      - name: Create archive
        run: zip -r "./${{ inputs.package }}.zip" "./${{ inputs.package }}"
        working-directory: ./packages

      - name: Upload package to S3
        run: |
          s3cmd \
            --access_key="${{ secrets.S3_ACCESS_KEY }}" \
            --secret_key="${{ secrets.S3_SECRET_KEY }}" \
            --host="${{ secrets.S3_HOST }}" \
            --host-bucket="${{ secrets.S3_HOST_BUCKET }}" \
            put \
            "./packages/${{ inputs.package }}.zip" \
            "${{ secrets.S3_UPLOAD_BASE_URL }}/${{ inputs.package }}.zip"

      - name: Upload package to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: "${{ inputs.package }}"
          path: ./packages/${{ inputs.package }}
